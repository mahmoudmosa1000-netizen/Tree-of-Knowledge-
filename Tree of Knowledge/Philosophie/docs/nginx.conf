# Nginx-Konfiguration für Tree of Knowledge
# Zwei Varianten enthalten: (A) Standalone index.html  (B) Next.js Reverse-Proxy

# -------------------------------------------------------------------
# Variante A — Nur die statische index.html ausliefern
# -------------------------------------------------------------------
server {
    listen 80;
    server_name tree-of-knowledge.example.com;

    root /var/www/tree-of-knowledge;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# -------------------------------------------------------------------
# Variante B — Reverse-Proxy vor die Next.js App (z. B. via Docker)
# -------------------------------------------------------------------
server {
    listen 80;
    server_name app.tree-of-knowledge.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Ollama-Streaming braucht ggf. deaktiviertes Buffering
    location /api/ai {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
