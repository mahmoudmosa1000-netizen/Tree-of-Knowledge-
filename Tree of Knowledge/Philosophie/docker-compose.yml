version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tok-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tok_user:${POSTGRES_PASSWORD:-tok_pass}@postgres:5432/tree_of_knowledge
      OLLAMA_URL: http://ollama:11434
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - tok-network

  postgres:
    image: postgres:16-alpine
    container_name: tok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tok_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tok_pass}
      POSTGRES_DB: tree_of_knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tok_user -d tree_of_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tok-network

  ollama:
    image: ollama/ollama:latest
    container_name: tok-ollama
    restart: unless-stopped
    environment:
      OLLAMA_ORIGINS: "*"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - tok-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tok-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tree-of-knowledge.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - tok-network

networks:
  tok-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
  pgadmin-data:
